# Macro Pulse — series registry (single source of truth for metadata).
#
# Every series the system stores is declared here. Fields:
#   key            internal identifier (unique, snake_case)
#   name_en/name_fa human-readable names (fa is shown in the dashboard)
#   category       rates | fed | inflation | liquidity | global_liquidity | labor |
#                  curve | credit | dollar | leading | intermarket | commodities |
#                  expectations | crypto | gold | recession
#   source         collector name (fred | treasury | fiscaldata | nyfed | yahoo | bls)
#   source_id      identifier at the source (FRED series ID, Yahoo ticker, ...)
#   url            human-browsable source page
#   units          units after collection (no transformation applied)
#   frequency      D | W | M | Q | intraday
#   release_lag_days  typical delay between period end and publication
#   max_stale_days    validation fails if latest observation is older than this
#   valid_min/valid_max  sanity range; values outside fail validation
#   proxy          true when this series stands in for something not freely available
#   proxy_for      what it approximates (only when proxy: true)
#   cross_check    optional {key, tolerance, mode} — compare against another series
#   vintages       true when ALFRED vintages should be pulled (needs FRED_API_KEY)
#   start          earliest date to request

defaults:
  start: "1990-01-01"
  proxy: false
  vintages: false

series:
  # ───────────────────────────── Rates & Fed ─────────────────────────────
  - {key: fed_funds_eff_daily, name_en: "Effective Fed Funds Rate (daily)", name_fa: "نرخ مؤثر وجوه فدرال (روزانه)", category: rates, source: fred, source_id: DFF, url: "https://fred.stlouisfed.org/series/DFF", units: "%", frequency: D, release_lag_days: 1, max_stale_days: 7, valid_min: 0, valid_max: 25, cross_check: {key: nyfed_effr, tolerance: 0.02, mode: abs}}
  - {key: fed_funds_eff_monthly, name_en: "Effective Fed Funds Rate (monthly)", name_fa: "نرخ مؤثر وجوه فدرال (ماهانه)", category: rates, source: fred, source_id: FEDFUNDS, url: "https://fred.stlouisfed.org/series/FEDFUNDS", units: "%", frequency: M, release_lag_days: 1, max_stale_days: 45, valid_min: 0, valid_max: 25}
  - {key: fed_target_upper, name_en: "Fed Funds Target Range – Upper", name_fa: "سقف دامنه هدف نرخ بهره", category: fed, source: fred, source_id: DFEDTARU, url: "https://fred.stlouisfed.org/series/DFEDTARU", units: "%", frequency: D, release_lag_days: 1, max_stale_days: 7, valid_min: 0, valid_max: 25, start: "2008-12-16"}
  - {key: fed_target_lower, name_en: "Fed Funds Target Range – Lower", name_fa: "کف دامنه هدف نرخ بهره", category: fed, source: fred, source_id: DFEDTARL, url: "https://fred.stlouisfed.org/series/DFEDTARL", units: "%", frequency: D, release_lag_days: 1, max_stale_days: 7, valid_min: 0, valid_max: 25, start: "2008-12-16"}
  - {key: iorb, name_en: "Interest on Reserve Balances", name_fa: "نرخ بهره ذخایر (IORB)", category: fed, source: fred, source_id: IORB, url: "https://fred.stlouisfed.org/series/IORB", units: "%", frequency: D, release_lag_days: 1, max_stale_days: 7, valid_min: 0, valid_max: 25, start: "2021-07-29"}
  - {key: sep_fed_funds_median, name_en: "FOMC SEP median fed funds projection (dot plot)", name_fa: "میانه پیش‌بینی نرخ بهره اعضای فدرال (Dot Plot)", category: fed, source: fred, source_id: FEDTARMD, url: "https://fred.stlouisfed.org/series/FEDTARMD", units: "%", frequency: Q, release_lag_days: 0, max_stale_days: 120, valid_min: 0, valid_max: 25, start: "2012-01-01"}
