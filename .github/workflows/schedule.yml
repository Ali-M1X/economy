name: schedule
# All scheduled work. GitHub starts scheduled runs late (often by an hour or more) or skips them, so every run asks
# `jobs.scheduler plan` what is due now, whichever cron fired (the cron strings below must match jobs/scheduler.py —
# a test checks this):
#   release   an important release (★4+) came out in the last 6 h and was not reported → wait for the new value
#             (≤ 2 h) → full pipeline → report with what changed since the last report
#   daily     the 09:00 Tehran report has not gone out → wait (a run may start up to 5 h early) → refresh → send at 09:00
#   watch     an important release is ≤ 4.5 h away → wait → pre-release alert 1 h before → wait → release run
#   otherwise the cron's own job: */15 intraday news alerts, Saturday weekly summary, hourly pre-positioning check
# The 00:40–04:40 UTC crons only add chances for the 09:00 report to start in time. Scheduled workflows run only
# from the default branch and are disabled after 60 days without repository activity.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "40 0,1,2,3,4 * * *"
    - cron: "20 3 * * 6"
    - cron: "50 * * * *"
    - cron: "35 12,13 * * 1-5"
    - cron: "5 14,15,17,18,19 * * 1-5"
    - cron: "35 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run now"
        type: choice
        options: [report, daily, release, intraday, weekly, prepos]
        default: report
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      events: ${{ steps.plan.outputs.events }}
      trigger: ${{ steps.plan.outputs.trigger }}
      wait_until: ${{ steps.plan.outputs.wait_until }}
      release_at: ${{ steps.plan.outputs.release_at }}
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SCHEDULE: ${{ github.event.schedule }}
      MODE_INPUT: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            state/health_last.json
            state/headsup_sent.json
            state/daily_sent.json
            state/daily_claim.json
            state/watched.json
            state/last_scores.json
            state/reported_events.json
            state/fed_docs_scored.csv
          key: mp-state-pipe-${{ github.run_id }}
          restore-keys: mp-state-pipe-
      - id: plan
        # a scheduled plan also claims the work it took (daily / watched / reported), so later runs skip it
        run: python -m jobs.scheduler plan --schedule "$SCHEDULE" --mode "$MODE_INPUT" --state state
      - if: contains(fromJSON('["release", "daily", "watch"]'), steps.plan.outputs.mode) && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: |
            state/health_last.json
            state/headsup_sent.json
            state/daily_sent.json
            state/daily_claim.json
            state/watched.json
            state/last_scores.json
            state/reported_events.json
            state/fed_docs_scored.csv
          key: mp-state-pipe-${{ github.run_id }}-plan

  wait:
    # daily: sleep until ~25 min before 09:00 Tehran (the report itself waits for 09:00 sharp)
    # watch: sleep until 1 h before the release → pre-release alert → sleep until the release time
    needs: plan
    if: contains(fromJSON('["daily", "watch"]'), needs.plan.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions: {contents: read, actions: read}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      MACRO_PULSE_OUTPUT_DIR: snap
      WAIT_UNTIL: ${{ needs.plan.outputs.wait_until }}
      RELEASE_AT: ${{ needs.plan.outputs.release_at }}
      EVENTS: ${{ needs.plan.outputs.events }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m jobs.scheduler sleep --until "$WAIT_UNTIL"
      - name: Find the latest full pipeline run
        if: needs.plan.outputs.mode == 'watch'
        id: snap
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow data-availability.yml --status success \
                --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: needs.plan.outputs.mode == 'watch'
        uses: actions/download-artifact@v4
        with: {name: data-availability, path: snap, run-id: "${{ steps.snap.outputs.run }}", github-token: "${{ github.token }}"}
      - if: needs.plan.outputs.mode == 'watch'
        uses: actions/cache/restore@v4
        with:
          path: |
            state/zq_history.csv
            state/book_history_BTC.csv
            state/book_history_PAXG.csv
          key: mp-state-prepos-${{ github.run_id }}
          restore-keys: mp-state-prepos-
      - name: Live pre-positioning read
        if: needs.plan.outputs.mode == 'watch'
        continue-on-error: true  # the alert goes out without it
        run: python -m jobs.prepos --from-cache snap/cache --state state --refresh-live --live-only snap/prepos.json
      - name: Pre-release alert (Telegram)
        if: needs.plan.outputs.mode == 'watch'
        continue-on-error: true  # the release report must still run
        run: python -m jobs.notify prealert --root snap --events "$EVENTS"
      - if: needs.plan.outputs.mode == 'watch'
        run: python -m jobs.scheduler sleep --until "$RELEASE_AT"

  intraday:
    needs: plan
    if: needs.plan.outputs.mode == 'intraday'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: {group: intraday, cancel-in-progress: false}
    outputs:
      trigger_report: ${{ steps.scan.outputs.trigger_report }}
      trigger_text: ${{ steps.scan.outputs.trigger_text }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            state/news_scored.csv
            state/news_alerted.json
          key: mp-state-news-${{ github.run_id }}
          restore-keys: mp-state-news-
      - id: scan
        run: python -m jobs.intraday --state state
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state/news_scored.csv
            state/news_alerted.json
          key: mp-state-news-${{ github.run_id }}-${{ github.run_attempt }}

  prepos:
    needs: plan
    if: needs.plan.outputs.mode == 'prepos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    concurrency: {group: prepos, cancel-in-progress: false}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      MACRO_PULSE_OUTPUT_DIR: snap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Find the latest full pipeline run
        id: snap
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow data-availability.yml --status success \
                --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: {name: data-availability, path: snap, run-id: "${{ steps.snap.outputs.run }}", github-token: "${{ github.token }}"}
      - uses: actions/cache/restore@v4
        with:
          path: |
            state/zq_history.csv
            state/book_history_BTC.csv
            state/book_history_PAXG.csv
            state/prepos_sent.json
          key: mp-state-prepos-${{ github.run_id }}
          restore-keys: mp-state-prepos-
      - name: Live pre-positioning check
        run: python -m jobs.prepos --from-cache snap/cache --state state --refresh-live --live-only snap/prepos.json
      - name: Telegram (only releases/assets with a proven out-of-sample edge)
        run: python -m jobs.notify prepos --root snap --state state
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: prepos-live, path: "snap/prepos.json\nsnap/prepos.md\nsnap/outbox/"}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state/zq_history.csv
            state/book_history_BTC.csv
            state/book_history_PAXG.csv
            state/prepos_sent.json
          key: mp-state-prepos-${{ github.run_id }}-${{ github.run_attempt }}

  pipeline:
    needs: [plan, wait]
    if: >-
      !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') &&
      contains(fromJSON('["daily", "watch", "release", "weekly", "report"]'), needs.plan.outputs.mode)
    permissions: {contents: write}  # only the opt-in publish-snapshot job inside uses it
    uses: ./.github/workflows/data-availability.yml
    with:
      mode: ${{ needs.plan.outputs.mode == 'watch' && 'release' || needs.plan.outputs.mode }}
      events: ${{ needs.plan.outputs.events }}
      trigger: ${{ needs.plan.outputs.trigger }}
    secrets: inherit

  news-report:
    needs: intraday
    if: needs.intraday.outputs.trigger_report == 'true'
    permissions: {contents: write}
    uses: ./.github/workflows/data-availability.yml
    with:
      mode: report
      trigger: ${{ needs.intraday.outputs.trigger_text }}
    secrets: inherit
