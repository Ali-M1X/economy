name: features-dev
# Fast iteration on Phase 2+ analytics (features, impact coefficients): reuses the data snapshot (output/cache) of the latest successful
# data-availability run instead of re-collecting. Never receives DATABASE_URL — no database access.
on:
  workflow_dispatch:
    inputs:
      inspect:
        description: "optional: '<series_key> <start> <end>' to print raw snapshot values"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths: ["features/**", "models/**", "backtest/**", "signals/**", "technicals/**", "jobs/features.py", "jobs/impact.py",
            "jobs/signals.py", "dashboard/**", "core/fa.py",
            ".github/workflows/features-dev.yml"]
concurrency: {group: features-dev, cancel-in-progress: true}
permissions:
  actions: read
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Find latest successful data snapshot
        id: snap
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow data-availability.yml --status success \
                --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"; echo "using data-availability run $RUN"
      - uses: actions/download-artifact@v4
        with:
          name: data-availability
          path: snapshot
          run-id: ${{ steps.snap.outputs.run }}
          github-token: ${{ github.token }}
      - name: Inspect snapshot values
        if: ${{ inputs.inspect != '' }}
        env: {INSPECT: "${{ inputs.inspect }}"}
        run: python -m jobs.inspect_cache snapshot/cache $INSPECT
      - run: python -m jobs.features --from-cache snapshot/cache
      - name: Phase 3 impact coefficients & macro score
        if: success() || failure()
        run: python -m jobs.impact --from-cache snapshot/cache
      - name: Phase 4 technicals & signals
        if: success() || failure()
        run: python -m jobs.signals --from-cache snapshot/cache
      - name: Phase 5 dashboard render check (real snapshot + fresh analysis outputs)
        if: success() || failure()
        run: |
          cp -f output/*.json output/*.csv output/*.md snapshot/ 2>/dev/null || true
          python -m dashboard.smoke snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: analysis-outputs, path: "output/*"}
